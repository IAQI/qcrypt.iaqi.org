name: PR Preview

on:
  pull_request:
    types: [opened, synchronize, reopened, closed]
  push:
    branches:
      - master

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: gh-pages-deploy
  cancel-in-progress: false

jobs:
  deploy-production:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare production publish directory
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p /tmp/publish
          rsync -a --delete \
            --exclude '.git/' \
            --exclude '.github/' \
            --exclude 'pr-preview/' \
            ./ /tmp/publish/

          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${repo_url}" gh-pages >/dev/null 2>&1; then
            git clone --depth=1 --branch gh-pages "${repo_url}" /tmp/gh-pages
            if [ -d /tmp/gh-pages/pr-preview ]; then
              mkdir -p /tmp/publish/pr-preview
              rsync -a /tmp/gh-pages/pr-preview/ /tmp/publish/pr-preview/
            fi
          fi

      - name: Deploy site root to gh-pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: /tmp/publish

  deploy-preview:
    if: github.event_name == 'pull_request' && github.event.action != 'closed' && github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-latest
    steps:
      - name: Checkout pull request
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha }}

      - name: Deploy preview to gh-pages/pr-preview/pr-${{ github.event.number }}
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_branch: gh-pages
          publish_dir: .
          destination_dir: pr-preview/pr-${{ github.event.number }}
          keep_files: true
          exclude_assets: .github,pr-preview

      - name: Post or update preview comment
        uses: actions/github-script@v7
        with:
          script: |
            const marker = '<!-- pr-preview-comment -->';
            const prNumber = context.payload.pull_request.number;
            const { owner, repo } = context.repo;
            const previewUrl = `https://iaqi.github.io/qcrypt.iaqi.org/pr-preview/pr-${prNumber}/`;
            const body = `${marker}
            🚀 Preview deployed: ${previewUrl}

            _Updates automatically on new commits to this PR. The preview is removed when the PR closes._`;

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: prNumber,
              per_page: 100,
            });

            const existing = comments.find((comment) => comment.body?.includes(marker));

            if (existing) {
              await github.rest.issues.updateComment({
                owner,
                repo,
                comment_id: existing.id,
                body,
              });
            } else {
              await github.rest.issues.createComment({
                owner,
                repo,
                issue_number: prNumber,
                body,
              });
            }

  cleanup-preview:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    runs-on: ubuntu-latest
    steps:
      - name: Check for gh-pages branch
        id: gh_pages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          repo_url="https://x-access-token:${GITHUB_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git ls-remote --exit-code --heads "${repo_url}" gh-pages >/dev/null 2>&1; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Checkout gh-pages
        if: steps.gh_pages.outputs.exists == 'true'
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          fetch-depth: 0

      - name: Remove preview directory
        if: steps.gh_pages.outputs.exists == 'true'
        id: remove_preview
        run: |
          preview_dir="pr-preview/pr-${{ github.event.number }}"
          if [ -d "$preview_dir" ]; then
            rm -rf "$preview_dir"
            echo "removed=true" >> "$GITHUB_OUTPUT"
          else
            echo "removed=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Commit and push cleanup
        if: steps.gh_pages.outputs.exists == 'true' && steps.remove_preview.outputs.removed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove PR preview for #${{ github.event.number }}"
          git pull --rebase origin gh-pages
          git push origin gh-pages
